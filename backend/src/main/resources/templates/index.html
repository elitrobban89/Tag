<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniPrisTåget – Sök tåg</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: #f3f4f6; min-height: 100vh; padding: 24px 16px 48px; }

    .wrap { max-width: 520px; margin: 0 auto; }

    .header {
      background: linear-gradient(135deg, #0f2d1e 0%, #1b4332 55%, #2d6a4f 100%);
      border-radius: 20px 20px 0 0;
      padding: 30px 28px 26px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .header::before { content:''; position:absolute; top:-40px; right:-40px; width:160px; height:160px;
                       background:rgba(255,255,255,.05); border-radius:50%; pointer-events:none; }
    .header::after  { content:''; position:absolute; bottom:-30px; left:-30px; width:120px; height:120px;
                       background:rgba(255,255,255,.04); border-radius:50%; pointer-events:none; }
    .header-icon { display:inline-flex; align-items:center; justify-content:center;
                   width:52px; height:52px; background:rgba(255,255,255,.12);
                   border-radius:14px; font-size:1.6rem; margin-bottom:12px;
                   backdrop-filter:blur(4px); position:relative; }
    .header h1 { font-size:1.55rem; font-weight:800; color:#fff;
                 letter-spacing:-.02em; margin-bottom:5px; position:relative; }
    .header p  { font-size:.85rem; color:rgba(255,255,255,.65); position:relative; }

    .card { background:#fff; border-radius:0 0 20px 20px;
            padding:26px 24px 22px; box-shadow:0 8px 32px rgba(0,0,0,.10); }

    .field { margin-bottom:16px; }
    .label { display:flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700;
             letter-spacing:.08em; text-transform:uppercase; color:#1b4332; margin-bottom:7px; }
    .label-note { font-weight:400; text-transform:none; font-size:.75rem;
                  color:#9ca3af; letter-spacing:0; }

    .input-row { display:flex; gap:8px; align-items:stretch; }
    input[type=text], input[type=date] {
      flex:1; height:46px; padding:0 13px; font-size:.95rem;
      background:#f9fafb; border:2px solid #e5e7eb; border-radius:10px;
      color:#111827; outline:none; width:100%;
      transition:border-color .18s, box-shadow .18s, background .18s;
    }
    input[type=text]:focus, input[type=date]:focus {
      border-color:#1b4332; background:#fff;
      box-shadow:0 0 0 4px rgba(27,67,50,.10);
    }
    input::placeholder { color:#9ca3af; }

    .gps-btn {
      flex-shrink:0; height:46px; padding:0 14px;
      background:linear-gradient(135deg,#1b4332,#2d6a4f);
      color:#fff; border:none; border-radius:10px; font-size:.82rem; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap;
      box-shadow:0 2px 10px rgba(27,67,50,.30);
      transition:opacity .18s, transform .1s;
    }
    .gps-btn:hover  { opacity:.88; }
    .gps-btn:active { transform:scale(.97); }
    @keyframes pulse { 0%,100%{box-shadow:0 2px 10px rgba(27,67,50,.30);}
                       50%{box-shadow:0 2px 22px rgba(27,67,50,.60);} }
    .gps-btn.fetching { animation:pulse 1.1s ease-in-out infinite; cursor:default; }

    .hint { font-size:.77rem; min-height:15px; margin:5px 0 0; color:#6b7280; }
    .hint.loading { color:#1b4332; } .hint.error { color:#dc2626; }

    .trip-toggle { display:flex; background:#f3f4f6; border-radius:10px; padding:4px; gap:4px; }
    .trip-btn { flex:1; height:36px; border:none; border-radius:7px; font-size:.87rem;
                font-weight:600; color:#6b7280; background:transparent; cursor:pointer;
                transition:background .18s, color .18s, box-shadow .18s; }
    .trip-btn.active { background:#fff; color:#1b4332; box-shadow:0 1px 6px rgba(0,0,0,.10); }

    .date-row { display:flex; gap:10px; margin-bottom:16px; }
    .date-field { flex:1; margin-bottom:0; }
    #return-wrap { display:none; }
    #return-wrap.show { display:block; }

    .search-btn {
      width:100%; height:50px; margin-top:20px;
      background:linear-gradient(135deg,#0f2d1e 0%,#1b4332 55%,#2d6a4f 100%);
      color:#fff; border:none; border-radius:12px; font-size:1rem; font-weight:700;
      cursor:pointer; box-shadow:0 4px 18px rgba(27,67,50,.35);
      transition:opacity .18s, transform .1s;
    }
    .search-btn:hover  { opacity:.90; }
    .search-btn:active { transform:scale(.98); }

    .cat-section { display:none; margin-top:20px; padding-top:16px;
                   border-top:1px solid #f3f4f6; }
    .cat-section.show { display:block; }
    .cat-title { font-size:.76rem; font-weight:700; text-transform:uppercase;
                 letter-spacing:.07em; color:#6b7280; margin-bottom:11px; }
    .cat-buttons { display:flex; gap:9px; }
    .cat-btn { flex:1; padding:13px 6px 11px; background:#f9fafb; border:2px solid #e5e7eb;
               border-radius:12px; font-size:.84rem; font-weight:700; color:#374151; cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:5px;
               transition:background .18s, border-color .18s, color .18s, transform .1s; }
    .cat-icon { font-size:1.5rem; line-height:1; }
    .cat-btn:hover  { background:#f0fdf4; border-color:#1b4332; color:#1b4332; }
    .cat-btn:active { transform:scale(.97); }
    .cat-btn.active { background:#1b4332; border-color:#0f2d1e; color:#fff;
                      box-shadow:0 4px 14px rgba(27,67,50,.30); }

    .error-box { background:#fef2f2; border:1px solid #fecaca; color:#dc2626;
                 padding:12px 16px; border-radius:10px; font-size:.88rem; margin-top:14px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-icon">🚂</div>
    <h1>MiniPrisTåget</h1>
    <p>Sök tågresor med riktiga avgångstider</p>
  </div>

  <div class="card">
    <form th:action="@{/search}" th:object="${form}" method="post">

      <!-- Från -->
      <div class="field">
        <div class="label">Från</div>
        <div class="input-row">
          <input type="text" th:field="*{from}" id="from" placeholder="Station eller stad...">
          <button type="button" id="gps-btn" class="gps-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.3" stroke-linecap="round">
              <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
            <span id="gps-label">GPS</span>
          </button>
        </div>
        <div id="gps-hint" class="hint"></div>
      </div>

      <!-- Till -->
      <div class="field">
        <div class="label">Till <span class="label-note">— lämna tom för AI-förslag</span></div>
        <input type="text" th:field="*{to}" id="to" placeholder="Station eller stad...">
        <div id="till-hint" class="hint"></div>
      </div>

      <!-- Restyp -->
      <div class="field">
        <div class="label">Restyp</div>
        <div class="trip-toggle">
          <button type="button" id="btn-enkel" class="trip-btn active">Enkelresa</button>
          <button type="button" id="btn-tur"   class="trip-btn">Tur &amp; retur</button>
        </div>
        <input type="hidden" th:field="*{tripType}" id="trip-type">
      </div>

      <!-- Datum -->
      <div class="date-row">
        <div class="date-field field">
          <div class="label">Avresedatum</div>
          <input type="date" th:field="*{date}">
        </div>
        <div class="date-field field" id="return-wrap">
          <div class="label">Returdatum</div>
          <input type="date" th:field="*{returnDate}">
        </div>
      </div>

      <button type="submit" class="search-btn">🔍 Sök tåg</button>

      <!-- AI-kategorier -->
      <div id="cat-section" class="cat-section">
        <div class="cat-title">Vad vill du uppleva?</div>
        <div class="cat-buttons">
          <button type="button" id="cat-storstad" class="cat-btn">
            <span class="cat-icon">🏙️</span>Storstad
          </button>
          <button type="button" id="cat-natur" class="cat-btn">
            <span class="cat-icon">🌲</span>Natur
          </button>
          <button type="button" id="cat-havet" class="cat-btn">
            <span class="cat-icon">🌊</span>Havet
          </button>
        </div>
      </div>

    </form>

    <!-- Felmeddelande -->
    <div th:if="${error}" class="error-box" th:text="${error}"></div>
  </div>
</div>

<script>
var BACKEND = '';

// ── GPS ──────────────────────────────────────────────────────────
function fetchGPS() {
  if (!navigator.geolocation) { setHint('GPS stöds inte.', 'error'); return; }
  var btn = document.getElementById('gps-btn');
  var lbl = document.getElementById('gps-label');
  btn.disabled = true; btn.classList.add('fetching');
  lbl.textContent = 'Hämtar...';
  setHint('📡 Hämtar position...', 'loading');

  navigator.geolocation.getCurrentPosition(function(pos) {
    fetch(BACKEND + '/nearest-station?lat=' + pos.coords.latitude + '&lon=' + pos.coords.longitude)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.name) document.getElementById('from').value = data.name;
        setHint('', '');
        btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
      })
      .catch(function() {
        setHint('Kunde inte hämta station.', 'error');
        btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
      });
  }, function(err) {
    var msgs = {1:'🔒 Åtkomst nekad.', 2:'📵 Position ej tillgänglig.', 3:'⏱ Timeout.'};
    setHint(msgs[err.code] || 'GPS-fel.', 'error');
    btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
  }, {enableHighAccuracy:false, timeout:8000, maximumAge:60000});
}

function setHint(msg, type) {
  var el = document.getElementById('gps-hint');
  el.textContent = msg; el.className = 'hint' + (type ? ' ' + type : '');
}

// ── Tur & retur toggle ────────────────────────────────────────────
document.getElementById('btn-enkel').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('btn-tur').classList.remove('active');
  document.getElementById('return-wrap').classList.remove('show');
  document.getElementById('trip-type').value = 'enkel';
});
document.getElementById('btn-tur').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('btn-enkel').classList.remove('active');
  document.getElementById('return-wrap').classList.add('show');
  document.getElementById('trip-type').value = 'tur';
});

// ── AI-kategorier ────────────────────────────────────────────────
var tillEl = document.getElementById('to');
var searchBtn = document.querySelector('.search-btn');

searchBtn.addEventListener('click', function(e) {
  if (!tillEl.value.trim()) {
    e.preventDefault();
    document.getElementById('cat-section').classList.add('show');
  }
}, true);

var cats = {storstad:'Storstad', natur:'Natur', havet:'Havet'};
Object.keys(cats).forEach(function(id) {
  document.getElementById('cat-' + id).addEventListener('click', function() {
    var from = document.getElementById('from').value.trim();
    ['storstad','natur','havet'].forEach(function(c) {
      document.getElementById('cat-' + c).classList.remove('active');
    });
    this.classList.add('active');
    var hint = document.getElementById('till-hint');
    hint.textContent = '✨ Hämtar AI-förslag...'; hint.className = 'hint loading';

    fetch(BACKEND + '/suggest', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({category: cats[id], from: from})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.destination) {
        tillEl.value = data.destination;
        hint.textContent = '✅ AI föreslog "' + data.destination + '"';
        hint.className = 'hint loading';
      }
    })
    .catch(function() {
      hint.textContent = 'Kunde inte hämta förslag.'; hint.className = 'hint error';
    });
  });
});

// ── Standarddatum = idag ─────────────────────────────────────────
var dateInputs = document.querySelectorAll('input[type=date]');
var today = new Date().toISOString().split('T')[0];
dateInputs.forEach(function(d) { if (!d.value) d.value = today; });

// ── Starta GPS ───────────────────────────────────────────────────
document.getElementById('gps-btn').addEventListener('click', fetchGPS);
fetchGPS();
</script>
</body>
</html>
