<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniPrisTåget – Sök tåg</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070d1f;
      min-height: 100vh;
    }

    /* Animerad bakgrund med rörliga glödbubblor */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 12% 38%, rgba(59,130,246,.22) 0%, transparent 52%),
        radial-gradient(ellipse at 88% 12%, rgba(99,102,241,.16) 0%, transparent 48%),
        radial-gradient(ellipse at 55% 92%, rgba(14,165,233,.13) 0%, transparent 50%),
        linear-gradient(180deg, #070d1f 0%, #0c1a38 50%, #070d1f 100%);
      animation: bgdrift 12s ease-in-out infinite alternate;
    }
    @keyframes bgdrift {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: .88; transform: scale(1.04) translateY(-8px); }
    }

    .wrap { max-width: 660px; margin: 0 auto; padding: 0 0 48px; position: relative; z-index: 1; }

    /* ── App header ── */
    .header {
      background: linear-gradient(135deg,
        rgba(29,78,216,.55) 0%,
        rgba(37,99,235,.65) 55%,
        rgba(59,130,246,.45) 100%);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(96,165,250,.22); border-bottom: none;
      padding: 30px 28px 26px; text-align: center;
      position: relative; overflow: hidden;
      box-shadow: 0 0 60px rgba(59,130,246,.15), inset 0 1px 0 rgba(255,255,255,.1);
    }
    .header::before { content:''; position:absolute; top:-60px; right:-50px;
      width:220px; height:220px;
      background: radial-gradient(circle, rgba(96,165,250,.3) 0%, transparent 70%);
      border-radius:50%; pointer-events:none; animation: orb1 6s ease-in-out infinite alternate; }
    .header::after  { content:''; position:absolute; bottom:-60px; left:-40px;
      width:190px; height:190px;
      background: radial-gradient(circle, rgba(139,92,246,.2) 0%, transparent 70%);
      border-radius:50%; pointer-events:none; animation: orb2 8s ease-in-out infinite alternate; }
    @keyframes orb1 { 0%{transform:translate(0,0);} 100%{transform:translate(15px,-10px);} }
    @keyframes orb2 { 0%{transform:translate(0,0);} 100%{transform:translate(-10px,12px);} }

    .header-icon { display:inline-flex; align-items:center; justify-content:center;
                   width:90px; height:90px; margin-bottom:10px; position:relative;
                   filter: drop-shadow(0 0 16px rgba(96,165,250,.5)); }
    .header-icon img { width:90px; height:90px; object-fit:contain; }
    .header h1 { font-size:1.55rem; font-weight:800; color:#fff;
                 letter-spacing:-.02em; margin-bottom:5px; position:relative;
                 text-shadow: 0 0 30px rgba(96,165,250,.6); }
    .header p  { font-size:.85rem; color:rgba(255,255,255,.55); position:relative; }

    /* ── Search card ── */
    .card {
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 0 0 20px 20px;
      border: 1px solid rgba(255,255,255,.09); border-top: none;
      padding: 26px 24px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 -1px 0 rgba(255,255,255,.04);
    }

    .field { margin-bottom:16px; }
    .label { display:flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700;
             letter-spacing:.08em; text-transform:uppercase;
             color:rgba(147,197,253,.85); margin-bottom:7px; }
    .label-note { font-weight:400; text-transform:none; font-size:.75rem;
                  color:rgba(255,255,255,.3); letter-spacing:0; }

    .input-row { display:flex; gap:8px; align-items:stretch; }
    input[type=text], input[type=date] {
      flex:1; height:46px; padding:0 13px; font-size:.95rem;
      background: rgba(255,255,255,.08);
      border: 1.5px solid rgba(255,255,255,.12);
      border-radius:10px; color:#fff; outline:none; width:100%;
      transition:border-color .18s, box-shadow .18s, background .18s;
    }
    input[type=text]:focus, input[type=date]:focus {
      border-color:#3b82f6; background:rgba(59,130,246,.12);
      box-shadow:0 0 0 4px rgba(59,130,246,.2);
    }
    input::placeholder { color:rgba(255,255,255,.28); }
    input[type=date]::-webkit-calendar-picker-indicator { filter:invert(1) opacity(.5); cursor:pointer; }

    .gps-btn {
      flex-shrink:0; height:46px; padding:0 14px;
      background: linear-gradient(135deg,#1d4ed8,#3b82f6);
      color:#fff; border:none; border-radius:10px; font-size:.82rem; font-weight:700;
      cursor:pointer; display:flex; align-items:center; gap:5px; white-space:nowrap;
      box-shadow:0 2px 12px rgba(59,130,246,.45);
      transition:opacity .18s, transform .1s;
    }
    .gps-btn:hover  { opacity:.88; }
    .gps-btn:active { transform:scale(.97); }
    @keyframes pulse { 0%,100%{box-shadow:0 2px 12px rgba(59,130,246,.45);}
                       50%{box-shadow:0 2px 28px rgba(59,130,246,.85);} }
    .gps-btn.fetching { animation:pulse 1.1s ease-in-out infinite; cursor:default; }

    .hint { font-size:.77rem; min-height:15px; margin:5px 0 0; color:rgba(255,255,255,.4); }
    .hint.loading { color:#60a5fa; } .hint.error { color:#f87171; }

    .trip-toggle { display:flex; background:rgba(255,255,255,.07); border-radius:10px; padding:4px; gap:4px; }
    .trip-btn { flex:1; height:36px; border:none; border-radius:7px; font-size:.87rem;
                font-weight:600; color:rgba(255,255,255,.4); background:transparent; cursor:pointer;
                transition:background .18s, color .18s, box-shadow .18s; }
    .trip-btn.active { background:rgba(59,130,246,.3); color:#fff;
                       box-shadow:0 1px 8px rgba(59,130,246,.3);
                       border:1px solid rgba(59,130,246,.35); }

    .date-row { display:flex; gap:10px; margin-bottom:16px; }
    .date-field { flex:1; margin-bottom:0; }
    #return-wrap { display:none; }
    #return-wrap.show { display:block; }

    .search-btn {
      width:100%; height:50px; margin-top:20px;
      background: linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%);
      color:#fff; border:none; border-radius:12px; font-size:1rem; font-weight:700;
      cursor:pointer;
      box-shadow:0 4px 20px rgba(59,130,246,.5), 0 0 0 0 rgba(59,130,246,.3);
      transition:opacity .18s, transform .1s, box-shadow .2s;
    }
    .search-btn:hover  { opacity:.92; box-shadow:0 6px 32px rgba(59,130,246,.65), 0 0 50px rgba(59,130,246,.15); }
    .search-btn:active { transform:scale(.98); }
    .search-btn:disabled { opacity:.45; cursor:default; transform:none; }

    .cat-section { display:none; margin-top:20px; padding-top:16px;
                   border-top:1px solid rgba(255,255,255,.08); }
    .cat-section.show { display:block; }
    .cat-title { font-size:.76rem; font-weight:700; text-transform:uppercase;
                 letter-spacing:.07em; color:rgba(147,197,253,.65); margin-bottom:11px; }
    .cat-buttons { display:flex; gap:9px; }
    .cat-btn { flex:1; padding:13px 6px 11px;
               background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.1);
               border-radius:12px; font-size:.84rem; font-weight:700;
               color:rgba(255,255,255,.65); cursor:pointer;
               display:flex; flex-direction:column; align-items:center; gap:5px;
               transition:background .18s, border-color .18s, color .18s, transform .1s; }
    .cat-icon { font-size:1.5rem; line-height:1; }
    .cat-btn:hover  { background:rgba(59,130,246,.2); border-color:rgba(96,165,250,.5); color:#fff; }
    .cat-btn:active { transform:scale(.97); }
    .cat-btn.active { background:rgba(59,130,246,.35); border-color:#3b82f6; color:#fff;
                      box-shadow:0 4px 16px rgba(59,130,246,.4); }

    .error-box { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3);
                 color:#fca5a5; padding:12px 16px; border-radius:10px;
                 font-size:.88rem; margin-top:14px; }

    /* ── Results section ── */
    #results-section { display:none; }

    .res-header {
      background: linear-gradient(135deg,
        rgba(29,78,216,.6) 0%,
        rgba(37,99,235,.7) 55%,
        rgba(59,130,246,.5) 100%);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-radius: 20px 20px 0 0;
      border: 1px solid rgba(96,165,250,.22); border-bottom: none;
      padding: 18px 22px 24px;
      position: relative; overflow: hidden;
      box-shadow: 0 0 40px rgba(59,130,246,.12);
    }
    .res-header::before { content:''; position:absolute; top:-40px; right:-40px;
      width:160px; height:160px;
      background:radial-gradient(circle,rgba(96,165,250,.25) 0%,transparent 70%);
      border-radius:50%; pointer-events:none; }

    .res-back-btn {
      display:inline-flex; align-items:center; gap:6px;
      color:rgba(255,255,255,.65); font-size:.8rem; font-weight:600;
      background:none; border:none; cursor:pointer; margin-bottom:14px;
      padding:0; transition:color .15s;
    }
    .res-back-btn:hover { color:#fff; }

    .res-route { display:flex; align-items:center; gap:10px; margin-bottom:5px; }
    .res-station { font-size:1.15rem; font-weight:800; color:#fff; }
    .res-arrow   { color:rgba(255,255,255,.4); }
    .res-meta    { font-size:.78rem; color:rgba(255,255,255,.5);
                   display:flex; align-items:center; gap:12px; }
    .res-count   { position:absolute; top:18px; right:20px;
                   background:rgba(255,255,255,.12); color:#fff;
                   font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:16px; }

    /* ── Departure list container ── */
    .dep-list {
      background: rgba(5,10,25,.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 12px 14px 14px;
      border-radius: 0 0 20px 20px;
      border: 1px solid rgba(96,165,250,.12); border-top: none;
      box-shadow: 0 12px 48px rgba(0,0,0,.4);
      margin-bottom: 14px;
    }
    .list-header {
      display:flex; align-items:center; gap:8px;
      padding:4px 4px 10px;
      font-size:.72rem; font-weight:700;
      text-transform:uppercase; letter-spacing:.09em;
      color:rgba(147,197,253,.75);
    }
    .list-dot { width:7px; height:7px; background:#3b82f6; border-radius:50%; flex-shrink:0;
                box-shadow:0 0 6px rgba(59,130,246,.8); }

    /* ── Departure card ── */
    .dep-card {
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 18px 20px 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      transition: box-shadow .2s, transform .2s, border-color .2s;
    }
    .dep-card:last-child { margin-bottom: 0; }
    .dep-card:hover {
      box-shadow: 0 8px 28px rgba(59,130,246,.18), 0 0 0 1px rgba(96,165,250,.25);
      border-color: rgba(96,165,250,.22);
      transform: translateY(-2px);
    }
    .dep-card.canceled { opacity:.4; }
    .dep-card.delayed  { border-left:3px solid #f59e0b; }

    .card-main { display:flex; align-items:flex-start; gap:14px; }
    .card-left { flex:1; min-width:0; }

    .card-time-range {
      font-size:1.55rem; font-weight:800; color:#fff;
      letter-spacing:-.025em; line-height:1.1; margin-bottom:4px;
      text-shadow:0 0 20px rgba(255,255,255,.12);
    }
    .card-time-delayed { color:#fbbf24; font-size:.8rem; font-weight:700; margin-left:6px; }
    .card-travel-info  { font-size:.84rem; color:rgba(255,255,255,.45); margin-bottom:13px; }

    .card-train-row { display:flex; align-items:center; gap:12px; }
    .card-train-photo {
      width:170px; height:58px;
      object-fit:cover; object-position:center 60%;
      border-radius:8px; flex-shrink:0;
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 4px 14px rgba(0,0,0,.4);
    }
    .card-train-label  { font-size:.80rem; color:rgba(255,255,255,.5); line-height:1.5; }
    .card-train-model  { font-weight:700; color:rgba(147,197,253,.9); }

    .card-right {
      display:flex; flex-direction:column;
      align-items:flex-end; min-width:94px; flex-shrink:0;
    }
    .card-price-fr  { font-size:.76rem; color:rgba(255,255,255,.4); margin-bottom:1px; }
    .card-price-amt {
      font-size:1.65rem; font-weight:800; color:#fff;
      letter-spacing:-.03em; line-height:1.1;
      text-shadow:0 0 20px rgba(96,165,250,.5);
    }
    .card-price-model { font-size:.70rem; color:rgba(255,255,255,.35); margin-bottom:8px; }

    .dep-badge { font-size:.70rem; font-weight:700; padding:4px 10px;
                 border-radius:20px; white-space:nowrap; }
    .badge-ok       { background:rgba(59,130,246,.2); color:#93c5fd;
                      border:1px solid rgba(96,165,250,.3); }
    .badge-delayed  { background:rgba(245,158,11,.2); color:#fcd34d;
                      border:1px solid rgba(245,158,11,.3); }
    .badge-canceled { background:rgba(239,68,68,.2); color:#fca5a5;
                      border:1px solid rgba(239,68,68,.3); }

    .empty { padding:36px 20px; text-align:center; }
    .empty-icon  { font-size:2.2rem; margin-bottom:10px; }
    .empty-title { font-size:.95rem; font-weight:700; color:rgba(255,255,255,.65); margin-bottom:5px; }
    .empty-sub   { font-size:.82rem; color:rgba(255,255,255,.35); }

    /* Return section */
    .return-section { margin-top:14px; }
    .return-header {
      background: linear-gradient(135deg,
        rgba(88,28,135,.55) 0%,
        rgba(109,40,217,.6) 55%,
        rgba(139,92,246,.45) 100%);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-radius:20px 20px 0 0;
      border:1px solid rgba(167,139,250,.22); border-bottom:none;
      padding:16px 22px 20px; position:relative; overflow:hidden;
    }
    .return-header::before { content:''; position:absolute; top:-30px; right:-30px;
      width:130px; height:130px;
      background:radial-gradient(circle,rgba(167,139,250,.25) 0%,transparent 70%);
      border-radius:50%; pointer-events:none; }
    .return-label { font-size:.72rem; font-weight:700; text-transform:uppercase;
                    letter-spacing:.09em; color:rgba(255,255,255,.55); margin-bottom:7px; }
    .return-route { display:flex; align-items:center; gap:9px; }
    .return-station { font-size:1.08rem; font-weight:800; color:#fff; }
    .return-arrow   { color:rgba(255,255,255,.4); }
    .return-meta    { font-size:.78rem; color:rgba(255,255,255,.45); margin-top:5px; }
    .return-dep-list {
      border-radius:0 0 20px 20px;
      background:rgba(15,5,35,.7);
      border-color:rgba(167,139,250,.12);
    }
    .return-dep-list .list-dot    { background:#a78bfa; box-shadow:0 0 6px rgba(167,139,250,.8); }
    .return-dep-list .list-header { color:rgba(196,181,253,.75); }
  </style>
</head>
<body>
<div class="wrap">

  <!-- ── App header ── -->
  <div class="header" id="app-header">
    <div class="header-icon"><img src="/images/logo.png" alt="MiniPrisTåget"></div>
    <h1>MiniPrisTåget</h1>
    <p>Sök tågresor med riktiga avgångstider</p>
  </div>

  <!-- ── Search form ── -->
  <div id="form-card" class="card">
    <form id="search-form" action="javascript:void(0)" onsubmit="handleSearch(event)">

      <!-- Från -->
      <div class="field">
        <div class="label">Från</div>
        <div class="input-row">
          <input type="text" name="from" id="from" placeholder="Station eller stad...">
          <button type="button" id="gps-btn" class="gps-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.3" stroke-linecap="round">
              <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
            <span id="gps-label">GPS</span>
          </button>
        </div>
        <div id="gps-hint" class="hint"></div>
      </div>

      <!-- Till -->
      <div class="field">
        <div class="label">Till <span class="label-note">— lämna tom för AI-förslag</span></div>
        <input type="text" name="to" id="to" placeholder="Station eller stad...">
        <div id="till-hint" class="hint"></div>
      </div>

      <!-- Restyp -->
      <div class="field">
        <div class="label">Restyp</div>
        <div class="trip-toggle">
          <button type="button" id="btn-enkel" class="trip-btn active">Enkelresa</button>
          <button type="button" id="btn-tur"   class="trip-btn">Tur &amp; retur</button>
        </div>
        <input type="hidden" name="tripType" id="trip-type" value="enkel">
      </div>

      <!-- Datum -->
      <div class="date-row">
        <div class="date-field field">
          <div class="label">Avresedatum</div>
          <input type="date" name="date" id="dep-date">
        </div>
        <div class="date-field field" id="return-wrap">
          <div class="label">Returdatum</div>
          <input type="date" name="returnDate" id="ret-date">
        </div>
      </div>

      <button type="submit" id="search-btn" class="search-btn">🔍 Sök resa</button>

      <!-- AI-kategorier -->
      <div id="cat-section" class="cat-section">
        <div class="cat-title">Vad vill du uppleva?</div>
        <div class="cat-buttons">
          <button type="button" id="cat-storstad" class="cat-btn">
            <span class="cat-icon">🏙️</span>Storstad
          </button>
          <button type="button" id="cat-natur" class="cat-btn">
            <span class="cat-icon">🌲</span>Natur
          </button>
          <button type="button" id="cat-strand" class="cat-btn">
            <span class="cat-icon">🏖️</span>Strand
          </button>
        </div>
      </div>

    </form>
    <div id="form-error" class="error-box" style="display:none;"></div>
  </div>

  <!-- ── Results ── -->
  <div id="results-section"></div>

</div>

<script>
var BACKEND = '';

// ── Helpers ──────────────────────────────────────────────────────
function esc(s) {
  return s == null ? '' : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setHint(msg, type) {
  var el = document.getElementById('gps-hint');
  el.textContent = msg; el.className = 'hint' + (type ? ' ' + type : '');
}
function showFormError(msg) {
  var el = document.getElementById('form-error');
  el.textContent = msg; el.style.display = 'block';
}
function clearFormError() {
  document.getElementById('form-error').style.display = 'none';
}

// ── GPS ──────────────────────────────────────────────────────────
function fetchGPS() {
  if (!navigator.geolocation) { setHint('GPS stöds inte.', 'error'); return; }
  var btn = document.getElementById('gps-btn');
  var lbl = document.getElementById('gps-label');
  btn.disabled = true; btn.classList.add('fetching');
  lbl.textContent = 'Hämtar...';
  setHint('📡 Hämtar position...', 'loading');

  navigator.geolocation.getCurrentPosition(function(pos) {
    fetch(BACKEND + '/nearest-station?lat=' + pos.coords.latitude + '&lon=' + pos.coords.longitude)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.name) document.getElementById('from').value = data.name;
        setHint('', '');
        btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
      })
      .catch(function() {
        setHint('Kunde inte hämta station.', 'error');
        btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
      });
  }, function(err) {
    var msgs = {
      1:'🔒 GPS nekad – ange startstation manuellt eller tillåt plats i webbläsaren.',
      2:'📵 Position ej tillgänglig – ange startstation manuellt.',
      3:'⏱ Timeout – ange startstation manuellt.'
    };
    setHint(msgs[err.code] || 'GPS-fel – ange startstation manuellt.', 'error');
    btn.disabled = false; btn.classList.remove('fetching'); lbl.textContent = 'GPS';
  }, {enableHighAccuracy:false, timeout:8000, maximumAge:60000});
}

// ── Tur & retur toggle ────────────────────────────────────────────
document.getElementById('btn-enkel').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('btn-tur').classList.remove('active');
  document.getElementById('return-wrap').classList.remove('show');
  document.getElementById('trip-type').value = 'enkel';
});
document.getElementById('btn-tur').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('btn-enkel').classList.remove('active');
  document.getElementById('return-wrap').classList.add('show');
  document.getElementById('trip-type').value = 'tur';
});

// ── AI-kategorier ────────────────────────────────────────────────
var cats = {storstad:'Storstad', natur:'Natur', strand:'Strand'};
Object.keys(cats).forEach(function(id) {
  document.getElementById('cat-' + id).addEventListener('click', function() {
    var from = document.getElementById('from').value.trim();
    ['storstad','natur','strand'].forEach(function(c) {
      document.getElementById('cat-' + c).classList.remove('active');
    });
    this.classList.add('active');
    var hint = document.getElementById('till-hint');
    hint.textContent = '✨ Hämtar AI-förslag...'; hint.className = 'hint loading';

    fetch(BACKEND + '/suggest', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({category: cats[id], from: from})
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.destination) {
        document.getElementById('to').value = data.destination;
        hint.textContent = '✅ AI föreslog "' + data.destination + '"';
        hint.className = 'hint loading';
        // Kör sökning automatiskt efter att AI fyllt i destination
        setTimeout(doSearch, 600);
      }
    })
    .catch(function() {
      hint.textContent = 'Kunde inte hämta förslag.'; hint.className = 'hint error';
    });
  });
});

// ── Sök (AJAX) ────────────────────────────────────────────────────
function handleSearch(e) {
  e.preventDefault();
  var to = document.getElementById('to').value.trim();
  if (!to) {
    document.getElementById('cat-section').classList.add('show');
    return;
  }
  doSearch();
}

function doSearch() {
  clearFormError();
  var btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Söker avgångar...';

  var payload = {
    from:       document.getElementById('from').value.trim(),
    to:         document.getElementById('to').value.trim(),
    date:       document.getElementById('dep-date').value,
    tripType:   document.getElementById('trip-type').value,
    returnDate: document.getElementById('ret-date').value
  };

  fetch(BACKEND + '/api/search', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    btn.disabled = false;
    btn.innerHTML = '🔍 Sök resa';
    if (data.error) {
      showFormError(data.error);
    } else {
      renderResults(data);
    }
  })
  .catch(function() {
    btn.disabled = false;
    btn.innerHTML = '🔍 Sök resa';
    showFormError('Kunde inte söka avgångar. Kontrollera att du har angett stationer korrekt.');
  });
}

// ── Visa sökformulär igen ─────────────────────────────────────────
function showForm() {
  document.getElementById('results-section').style.display = 'none';
  document.getElementById('results-section').innerHTML = '';
  document.getElementById('form-card').style.display = '';
  document.getElementById('app-header').style.borderRadius = '20px 20px 0 0';
}

// ── Räkna ut ankomsttid ───────────────────────────────────────────
function calcArrival(depTime, minutes) {
  if (!depTime || !minutes) return '';
  var parts = depTime.split(':');
  var total = parseInt(parts[0]) * 60 + parseInt(parts[1]) + minutes;
  var hh = Math.floor(total / 60) % 24;
  var mm = total % 60;
  return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

// ── Formatera restid ──────────────────────────────────────────────
function formatDuration(minutes) {
  if (!minutes || minutes <= 0) return '';
  var h = Math.floor(minutes / 60);
  var m = minutes % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + 'h';
  return h + 'h ' + m + 'min';
}

// ── Bygg avgångslista HTML (SJ-stil) ─────────────────────────────
function buildDepList(deps, title, isReturn) {
  var cls = 'dep-list' + (isReturn ? ' return-dep-list' : '');
  var html = '<div class="' + cls + '">';
  html += '<div class="list-header"><div class="list-dot"></div>' + esc(title) + '</div>';

  if (!deps || !deps.length) {
    html += '<div class="empty"><div class="empty-icon">🚉</div>';
    html += '<div class="empty-title">Inga avgångar hittades</div>';
    html += '<div class="empty-sub">Prova ett annat datum eller en annan sträcka.</div></div>';
  } else {
    for (var i = 0; i < deps.length; i++) {
      var d = deps[i];
      var cardCls = 'dep-card';
      if (d.canceled) cardCls += ' canceled';
      else if (d.delayed) cardCls += ' delayed';

      // Tidsintervall t.ex. "06:04 – 08:44"
      var arrTime = calcArrival(d.departureTime, d.travelMinutes);
      var timeRange = esc(d.departureTime) + (arrTime ? ' – ' + arrTime : '');

      // Restid + byten
      var dur = formatDuration(d.travelMinutes);
      var travelInfo = (dur ? 'Restid ' + dur + ' · ' : '') + '0 byten';

      // Pris: "från 489 kr" → "Fr." + "489:-"
      var priceAmt = '';
      if (d.price && d.price.indexOf('från ') === 0) {
        priceAmt = d.price.replace('från ', '').replace(' kr', ':-');
      }

      html += '<div class="' + cardCls + '">';
      html +=   '<div class="card-main">';

      // Vänster: tider + tåg
      html +=     '<div class="card-left">';
      html +=       '<div class="card-time-range">' + timeRange;
      if (d.delayed) html += '<span class="card-time-delayed">→ ' + esc(d.estimatedTime) + '</span>';
      html +=       '</div>';
      html +=       '<div class="card-travel-info">' + esc(travelInfo) + '</div>';
      html +=       '<div class="card-train-row">';
      if (d.trainImage) {
        html += '<img class="card-train-photo" src="' + esc(d.trainImage) + '" alt="' + esc(d.trainModel || '') + '">';
      }
      html +=         '<div class="card-train-label">';
      html +=           '<div class="card-train-model">' + esc(d.trainModel || '') + '</div>';
      html +=           esc(d.destination) + ' · tåg ' + esc(d.trainId);
      html +=         '</div>';
      html +=       '</div>';
      html +=     '</div>';

      // Höger: pris + badge
      html +=     '<div class="card-right">';
      if (priceAmt) {
        html += '<div class="card-price-fr">Fr.</div>';
        html += '<div class="card-price-amt">' + esc(priceAmt) + '</div>';
        html += '<div class="card-price-model">' + esc(d.trainModel || '') + '</div>';
      }
      if (d.canceled)     html += '<span class="dep-badge badge-canceled">Inställd</span>';
      else if (d.delayed) html += '<span class="dep-badge badge-delayed">Försenad</span>';
      else                html += '<span class="dep-badge badge-ok">I tid</span>';
      html +=     '</div>';

      html +=   '</div>'; // card-main
      html += '</div>';   // dep-card
    }
  }

  html += '</div>';
  return html;
}

// ── Visa resultat ─────────────────────────────────────────────────
function renderResults(data) {
  var n = data.departures ? data.departures.length : 0;
  var html = '';

  // Outbound header
  html += '<div class="res-header">';
  html +=   '<button class="res-back-btn" onclick="showForm()">';
  html +=     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>';
  html +=     ' Ny sökning';
  html +=   '</button>';
  html +=   '<div class="res-route">';
  html +=     '<span class="res-station">' + esc(data.fromName) + '</span>';
  html +=     '<span class="res-arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>';
  html +=     '<span class="res-station">' + esc(data.toName) + '</span>';
  html +=   '</div>';
  html +=   '<div class="res-meta">';
  html +=     '<span>📅 ' + esc(data.date) + '</span>';
  html +=     '<span>🚂 Tåg</span>';
  html +=   '</div>';
  if (n > 0) html += '<div class="res-count">' + n + ' avgångar</div>';
  html += '</div>';

  // Outbound departures
  html += buildDepList(data.departures, 'Avgångar', false);

  // Return
  if (data.returnDepartures) {
    html += '<div class="return-section">';
    html +=   '<div class="return-header">';
    html +=     '<div class="return-label">Tur &amp; retur</div>';
    html +=     '<div class="return-route">';
    html +=       '<span class="return-station">' + esc(data.returnFromName) + '</span>';
    html +=       '<span class="return-arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>';
    html +=       '<span class="return-station">' + esc(data.fromName) + '</span>';
    html +=     '</div>';
    html +=     '<div class="return-meta">📅 ' + esc(data.returnDate) + '</div>';
    html +=   '</div>';
    html += buildDepList(data.returnDepartures, 'Returavgångar', true);
    html += '</div>';
  }

  var section = document.getElementById('results-section');
  section.innerHTML = html;
  section.style.display = 'block';
  document.getElementById('form-card').style.display = 'none';
  // Remove bottom border radius from app header since results section follows it
  document.getElementById('app-header').style.borderRadius = '20px';
  section.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Standarddatum = idag ─────────────────────────────────────────
var today = new Date().toISOString().split('T')[0];
document.getElementById('dep-date').value = today;
document.getElementById('ret-date').value = today;

// ── Starta GPS ───────────────────────────────────────────────────
document.getElementById('gps-btn').addEventListener('click', fetchGPS);
fetchGPS();
</script>
