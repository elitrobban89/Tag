<style>
.mp-wrap *, .mp-wrap *::before, .mp-wrap *::after { box-sizing: border-box; margin: 0; padding: 0; }

.mp-wrap {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  max-width: 520px;
  margin: 0 auto;
}

/* ── Yttre ram (matchar sidans befintliga form) ── */
.mp-form-box {
  background: #fce9e6;
  border: 2px solid #7baabf;
  border-radius: 10px;
  padding: 18px 20px 20px;
}

/* ── Fältrubriker ── */
.mp-label {
  display: block;
  font-size: 0.92rem;
  font-weight: 600;
  color: #1e2a3a;
  margin-bottom: 6px;
}
.mp-label-note {
  font-weight: 400;
  font-size: 0.82rem;
  color: #888;
}

/* ── Input-rader ── */
.mp-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}

.mp-input {
  flex: 1;
  height: 44px;
  padding: 0 12px;
  font-size: 1rem;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 6px;
  color: #1e2a3a;
  outline: none;
  transition: border-color 0.18s;
  width: 100%;
}
.mp-input:focus { border-color: #7baabf; }
.mp-input::placeholder { color: #aaa; }

/* ── GPS-knapp ── */
.mp-gps-btn {
  height: 44px;
  padding: 0 14px;
  background: #1b4332;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 0.84rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.18s;
}
.mp-gps-btn:hover  { background: #0f2d22; }
.mp-gps-btn:active { opacity: 0.85; }
.mp-gps-btn.fetching { opacity: 0.6; cursor: default; }

/* ── Hint-text ── */
.mp-hint {
  font-size: 0.8rem;
  min-height: 18px;
  margin-bottom: 10px;
  color: #666;
}
.mp-hint.loading { color: #1b4332; }
.mp-hint.error   { color: #c0392b; }

/* ── Sök-knapp ── */
.mp-sök-btn {
  height: 44px;
  padding: 0 28px;
  background: #1b4332;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.mp-sök-btn:hover  { background: #0f2d22; }
.mp-sök-btn:active { opacity: 0.85; }

/* ── Kategori-sektion ── */
.mp-cat-section {
  display: none;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #d9c8c4;
}
.mp-cat-section.show { display: block; }

.mp-cat-title {
  font-size: 0.9rem;
  font-weight: 600;
  color: #1e2a3a;
  margin-bottom: 10px;
}

.mp-cat-buttons {
  display: flex;
  gap: 8px;
}

.mp-cat-btn {
  flex: 1;
  padding: 12px 6px;
  background: #fff;
  border: 1px solid #bbb;
  border-radius: 8px;
  font-size: 0.86rem;
  font-weight: 600;
  color: #1e2a3a;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: background 0.18s, border-color 0.18s;
}
.mp-cat-btn .mp-icon { font-size: 1.5rem; }
.mp-cat-btn:hover  { background: #f0f7f4; border-color: #1b4332; }
.mp-cat-btn.active { background: #1b4332; border-color: #1b4332; color: #fff; }

/* ── AI-förslag ── */
.mp-suggestions { display: none; margin-top: 12px; }
.mp-suggestions.show { display: block; }

.mp-loading {
  text-align: center;
  padding: 20px;
  color: #1b4332;
  font-size: 0.92rem;
  font-weight: 600;
  background: #fff;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.mp-sug-cards { display: flex; flex-direction: column; gap: 10px; }

.mp-sug-card {
  background: #fff;
  border: 1px solid #ccc;
  border-left: 4px solid #1b4332;
  border-radius: 8px;
  padding: 14px 16px 12px;
}
.mp-sug-name {
  font-size: 1rem;
  font-weight: 700;
  color: #1b4332;
  margin-bottom: 5px;
}
.mp-sug-desc {
  font-size: 0.85rem;
  color: #555;
  line-height: 1.5;
  margin-bottom: 10px;
}
.mp-sug-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.mp-sug-time {
  font-size: 0.82rem;
  color: #1b4332;
  font-weight: 600;
}
.mp-sug-pick {
  padding: 7px 16px;
  background: #1b4332;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.18s;
}
.mp-sug-pick:hover { background: #0f2d22; }

.mp-error-msg {
  text-align: center;
  color: #c0392b;
  padding: 12px;
  font-size: 0.88rem;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
}
</style>

<div class="mp-wrap">
  <div class="mp-form-box">

    <!-- Från -->
    <label class="mp-label" for="mp-from">Från:</label>
    <div class="mp-row">
      <input id="mp-from" class="mp-input" type="text" placeholder="Din stad...">
      <button id="mp-gps-btn" class="mp-gps-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        </svg>
        <span id="mp-gps-label">Hämta GPS</span>
      </button>
    </div>
    <div id="mp-hint" class="mp-hint"></div>

    <!-- Till -->
    <label class="mp-label" for="mp-till">
      Till: <span class="mp-label-note">(lämna tom för AI-förslag)</span>
    </label>
    <div class="mp-row" style="margin-bottom:14px;">
      <input id="mp-till" class="mp-input" type="text" placeholder="Destination...">
      <button id="mp-search-btn" class="mp-sök-btn">Sök</button>
    </div>

    <!-- Kategoriknappar -->
    <div id="mp-cat-section" class="mp-cat-section">
      <p class="mp-cat-title">Vad vill du uppleva?</p>
      <div class="mp-cat-buttons">
        <button id="mp-cat-storstad" class="mp-cat-btn"><span class="mp-icon">🏙️</span>Storstad</button>
        <button id="mp-cat-natur"    class="mp-cat-btn"><span class="mp-icon">🌲</span>Natur</button>
        <button id="mp-cat-strand"   class="mp-cat-btn"><span class="mp-icon">🏖️</span>Strand</button>
      </div>
    </div>

  </div>

  <!-- AI-förslag -->
  <div id="mp-suggestions" class="mp-suggestions"></div>
</div>
